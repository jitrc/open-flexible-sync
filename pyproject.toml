[project]
name = "ofs"
version = "0.4.2"
description = "Local folder sync with profile groups, mask modes, and timestamp rules."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
ofs = "ofs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

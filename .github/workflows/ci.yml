name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 python3-venv xvfb
      - name: Run pytest
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pytest
          xvfb-run -a .venv/bin/python -m pytest -q
